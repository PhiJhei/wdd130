<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>☑️ Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="q1">What does the acronym CSS stand for?</label>
            <input type="text" name="q1" id="q1">
            <label for="q2">How are id and class attributes selected in CSS?</label>
            <textarea name="q2" id="q2"></textarea>
            <label for="q3">Which of the following is a valid CSS comment?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="1">// Hello, World! </option>
                <option value="2">/* Hello, World! */</option>
                <option value="3">!-- Hello, World! --!</option>
            </select>
            <label for="q4">What is the bottom margin given its declaration?</label>
            <p class="margin-q4">margin: 10px 5px 15px;</p>
            <input type="number" name="q4" id="q4">

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
