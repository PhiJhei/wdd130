<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="White Water Rafting Contact Us Page - contact, address, employee profiles">
    <meta name="author" content="Jhei Salvatierra">
    <link rel="stylesheet" href="./styles/rafting.css">
</head>

<body>
    <header>
        <img src="./images/z-wwr-blue.jpg" alt="">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>Buchanan, Texas<br>+1 999 999 9999<br>info@whitewater.com</p>
        </div>
        <section class="form-section">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d54830.9080776442!2d-98.45105981134779!3d30.804548070493393!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x865af70a097c0001%3A0x61ff6e9ab7a3dcfa!2sOasis%20Lake%20Buchanan!5e0!3m2!1sen!2sph!4v1764405364782!5m2!1sen!2sph"
                width="300" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form class="form-holder">
                <!-- name & email -->
                <div>
                    <label for="fullname" name="fullname" id="fullname">Name</label>
                    <input type="text" name="fullname" id="fullname" placeholder="name">
                    <label for="email" name="email" id="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="email">
                </div>
                <!-- radio checkbox -->
                <div class="radio">
                    <p>Message Purpose</p>
                    <label for="request" name="" request id="request"><input type="radio" name="radio"> General
                        Inquiry</label>
                    <label for="request" name="" request id="request"><input type="radio" name="radio"> Reservation
                        Question</label>
                    <label for="request" name="" request id="request"><input type="radio" name="radio"> Website
                        Suggestion</label>
                </div>
                <div>
                    <!-- message from customer -->
                    <label for="message" id="message">Message</label>
                    <textarea name="message" id="message" placeholder="type here"></textarea>
                    <!-- subscription to mail -->
                    <label for="opt-in" name="" opt-in id="opt-in"><input type="checkbox"> Please Subscribe me to the
                        monthly
                        newsletter</label>
                    <!-- submit form -->
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </section>
        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/happy-cutomer.png" alt="">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/happy-cutomer.png" alt="">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/happy-cutomer.png" alt="">
                <figcaption>Employee Profile</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© 2025 | White Water Rafting | Jhei Salvatierra</p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="./images/facebook.svg" alt="facebook page">
            </a>
            <a href="instragam.com">
                <img src="./images/instagram.svg" alt="instagram page">
            </a>
            <a href="youtube.com">
                <img src="./images/youtube.svg" alt="youtube page">
            </a>
        </nav>
    </footer>
</body>

</html>
